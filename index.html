<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanifProf</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>PlanifProf</h1>
    <p class="subtitle">Planification hebdomadaire pour enseignants</p>
  </header>

  <main class="layout">
    <section class="panel schedule-panel">
      <div class="panel-header">
        <h2>Horaire de la semaine</h2>
        <button id="clear-schedule" class="btn btn-ghost">Vider l'horaire</button>
      </div>
      <div class="table-wrap">
        <table id="schedule-table">
          <thead>
            <tr>
              <th>Période</th>
              <th>Lundi</th>
              <th>Mardi</th>
              <th>Mercredi</th>
              <th>Jeudi</th>
              <th>Vendredi</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel tasks-panel">
      <div class="panel-header">
        <h2>Tâches à faire</h2>
      </div>
      <form id="task-form" class="task-form">
        <input type="text" id="task-input" placeholder="Ajouter une tâche…" required />
        <select id="task-priority">
          <option value="normale">Normale</option>
          <option value="haute">Haute</option>
          <option value="basse">Basse</option>
        </select>
        <button type="submit" class="btn btn-primary">Ajouter</button>
      </form>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>Les données sont sauvegardées localement dans votre navigateur.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
